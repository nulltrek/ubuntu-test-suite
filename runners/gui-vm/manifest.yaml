name: gui-vm
inputs:
  - name: iso
  # - name: release
  - name: test

setup:
  users:
    - name: ubuntu
      groups:
        - kvm
  apt:
    - build-essential
    - clang
    - libxkbcommon-dev
    - tesseract-ocr
    - sshpass
    - socat
    - ovmf
    - qemu-system-x86
    - qemu-utils
    - python3-venv
    - python3-dev
    - acl
  modules:
    - vhost_vsock

runtime:
  files:
    - /dev/kvm
    - /dev/vhost-vsock
  git:
    # - url: https://github.com/canonical/hardware-installer-testing.git
    #   dest: hardware-installer-testing
    - url: https://github.com/canonical/yarf.git
      dest: yarf
      ref: d4b9a9be8cf42779465a6e27538e1128fd8bf6e0
    - url: https://github.com/canonical/ubuntu-gui-testing.git
      dest: ubuntu-gui-testing

entrypoint: |
  [ -n "${iso}" ] || { echo "No image selected" >&2; exit 1; }
  [ -n "${test}" ] || { echo "No test selected" >&2; exit 1; }

  mkdir -p storage

  python3 -m venv uv-venv
  uv-venv/bin/pip install uv

  uv-venv/bin/uv sync --directory yarf
  uv-venv/bin/uv pip install --python yarf/.venv/bin/python3 -r hardware-installer-testing/requirements.txt

  VIRTUAL_ENV="$PWD/yarf/.venv" PATH="$PWD/yarf/.venv/bin:$PATH" \
    "$PWD/yarf/.venv/bin/python3" $SPREAD_PATH/runners/gui-vm/runner/spawn_and_run_test_suite.py"" \
    --test-suite $SPREAD_PATH/desktop-installer \
    --iso "${iso}" \
    --qemu-args-json $SPREAD_PATH/runners/gui-vm/runner/qemu-args.json \
    --cleanup-storage \
    --storage-prefix $PWD/storage \
    --suite "${test}"
