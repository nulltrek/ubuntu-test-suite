summary: Entire disk install
environment:
    ISO: /workspace/resources/resolute-desktop-amd64.iso
artifacts:
    - artifacts
execute: |
    echo RUN
    $SPREAD_PATH/runners/gui-vm/run.py \
        --test-suite "$SPREAD_PATH/desktop-installer" \
        --iso "$ISO" \
        --qemu-args-json "$SPREAD_PATH/runners/gui-vm/qemu-args.json" \
        --cleanup-storage \
        --suite Entire-Disk
