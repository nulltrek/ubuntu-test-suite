project: ubuntu-test-suite

warn-timeout: 30m
kill-timeout: 2h
workers: 1

backends:
  lxd:
    systems:
      - ubuntu-26.04:
          cpus: 8
          memory: 30G
          storage: 50G
          mount:
            source: ./resources
            path: /workspace/resources
          char-devices:
            - /dev/kvm
            - /dev/vhost-vsock

suites:
    desktop-installer/:
        summary: Testing installer flows with YARF
        prepare: |
          echo PREPARE
          $SPREAD_PATH/runners/gui-vm/setup.py

include:
  - ../../runners/gui-vm/
  - desktop-installer/

path: /workspace/tests
