project: ubuntu-test-suite

warn-timeout: 30m
kill-timeout: 2h
workers: 1

backends:
  lxd:
    systems:
      - ubuntu-26.04:
          vm: true
          cpus: 8
          memory: 30G
          storage: 50G
          mount:
            source: ./resources
            path: /workspace/resources

suites:
    desktop-installer/:
        summary: Testing installer flows with YARF
        prepare: |
          echo PREPARE
          apt-get update
          $SPREAD_PATH/bin/hwrap $SPREAD_PATH/runners/gui-vm/manifest.yaml setup

include:
  - ../../bin/hwrap
  - ../../runners/gui-vm/
  - desktop-installer/

path: /workspace/tests
